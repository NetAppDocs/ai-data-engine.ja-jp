    Data Engineの使用方法について説明しています。
  keywords: ai data engine, aide, storage optimization, investigation, policies, data
    governance, NetApp Console, governed ai access, mcp, model context protocol
  lead: AI Data Engineは、NetApp Consoleを通じて管理されるメタデータインテリジェンスサービスです。接続されたシステムをスキャンしてメタデータカタログを構築し、ストレージを最適化して大規模なデータガバナンスを行うための可視性とツールを提供します。ガバナンスが適用されたAIアクセスにより、AIクライアントはModel
    Context Protocol（MCP）を通じてそのメタデータを検索できます。
